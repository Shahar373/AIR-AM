# ============================================================================
#  AIR-AM  -  הגדרות RTLSDR-Airband עבור SDRplay RSP1B
#  תדרים: נתב"ג (LLBG) + TMA תל-אביב
# ----------------------------------------------------------------------------
#  ⚠️ התדרים מבוססים על מאגרים ציבוריים (OurAirports / SkyVector / RadioReference).
#     מומלץ לאמת מול ה-AIP הרשמי של רת"א:
#     https://en.caa.gov.il  (AD 2.5 TEL-AVIV / BEN-GURION – LLBG)
#     היתרון בסורק: תוך דקות תשמע אילו תדרים באמת פעילים.
#
#  עקרון "חלון התדרים":  כל הערוצים חייבים להיות בטווח
#       centerfreq ± (sample_rate / 2)
#  ה-RSP1B מכסה עד ~10 MHz בו-זמנית. תדרי נתב"ג נחלקים לשתי קבוצות
#  שרחוקות מדי כדי לתפוס אותן יחד, אז בוחרים קבוצה אחת בכל פעם:
#
#    קבוצה A (פעילה כברירת מחדל) - מגדל + ATIS + Ground מזרח (~129-135 MHz)
#    קבוצה B (כבויה, disable=true) - גישה/המראה + Ground מערב + מסירה (~118-122 MHz)
#
#  כדי להחליף קבוצה: שים disable=true באחת ו-disable=false (או הסר) בשנייה.
#  רק קבוצה אחת יכולה להיות פעילה (יש לך RSP1B אחד).
# ============================================================================

devices:
(
  # ==========================================================================
  #  קבוצה A  -  מגדל / ATIS / קרקע-מזרח   (ברירת מחדל)
  #  ATIS משדר ברצף => מצוין לבדיקה ראשונה שהשרשרת עובדת.
  #  Tower 134.6 => אישורי המראה/נחיתה (הכי מעניין).
  #  חלון: 131.9 ± 3.0  =>  128.9 .. 134.9 MHz
  # ==========================================================================
  {
    type = "soapysdr";
    device_string = "driver=sdrplay";
    gain = 30;              # כוונן 20-50; הסר את השורה ל-AGC אוטומטי
    sample_rate = 6.0;      # Msps. אם לא נתמך: SoapySDRUtil --probe="driver=sdrplay"
    mode = "multichannel";
    centerfreq = 131.9;

    channels:
    (
      {
        freq = 132.500;     # ATIS (רצף - בדיקה טובה)
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "atis.mp3"; name = "LLBG ATIS 132.5"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },
      {
        freq = 134.600;     # Tower (מגדל) - אישורי המראה/נחיתה
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "tower.mp3"; name = "LLBG Tower 134.6"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },
      {
        freq = 129.200;     # Ground East (קרקע מזרח)
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "ground_e.mp3"; name = "LLBG Ground E 129.2"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      }
    );
  },

  # ==========================================================================
  #  קבוצה B  -  גישה/המראה / קרקע-מערב / מסירה / TMA   (כבויה כברירת מחדל)
  #  להפעלה: שנה disable ל-false כאן, ו-disable=true בקבוצה A למעלה.
  #  חלון: 120.0 ± 2.5  =>  117.5 .. 122.5 MHz
  # ==========================================================================
  {
    disable = true;
    type = "soapysdr";
    device_string = "driver=sdrplay";
    gain = 30;
    sample_rate = 5.0;
    mode = "multichannel";
    centerfreq = 120.0;

    channels:
    (
      {
        freq = 120.500;     # Approach / Departure (גישה/המראה) - עמוס מאוד
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "approach.mp3"; name = "LLBG Approach 120.5"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },
      {
        freq = 121.400;     # Tel Aviv Control (TMA)
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "tlv_ctl.mp3"; name = "Tel Aviv Control 121.4"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },
      {
        freq = 118.050;     # Ground West (קרקע מערב)
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "ground_w.mp3"; name = "LLBG Ground W 118.05"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },
      {
        freq = 121.950;     # Clearance Delivery (מסירת אישורים)
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "delivery.mp3"; name = "LLBG Delivery 121.95"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },
      {
        freq = 121.500;     # Guard (חירום בינלאומי) - בונוס, בתוך החלון
        modulation = "am";
        outputs: (
          {
            type = "icecast"; server = "127.0.0.1"; port = 8000;
            mountpoint = "guard.mp3"; name = "Guard 121.5"; genre = "ATC";
            username = "source"; password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      }
    );
  }
);
