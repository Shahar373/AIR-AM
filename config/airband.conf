# ============================================================================
#  AIR-AM  -  קובץ הגדרות התחלתי (ברירת מחדל) ל-rtl_airband
# ----------------------------------------------------------------------------
#  ⚠️ קובץ זה מנוהל אוטומטית ע"י בורר התדרים (airam-web).
#     בכל כיוונון מהממשק הוובי הוא נכתב מחדש. אין צורך לערוך ידנית.
#
#  ברירת מחדל: ATIS נתב"ג 132.500 MHz (משדר ברצף => בדיקה טובה).
#  הסיסמה "airam" היא פנימית וקבועה (תואמת ל-Icecast) - אתה לא נדרש אליה.
# ============================================================================
devices:
(
  {
    type = "soapysdr";
    device_string = "driver=sdrplay";
    sample_rate = 2.56;
    mode = "multichannel";
    centerfreq = 132.8000;   # מוסט מ-freq (132.5) ב-0.3MHz כדי להתרחק מ-spike ה-DC
    channels:
    (
      {
        freq = 132.5000;
        modulation = "am";
        squelch_snr_threshold = 0;   # תמיד פתוח (ATIS משדר ברצף => auto-squelch נכשל)
        outputs:
        (
          {
            type = "icecast";
            server = "127.0.0.1";
            port = 8000;
            mountpoint = "live.mp3";
            name = "AIR-AM 132.500";
            username = "source";
            password = "airam";
          }
        );
      }
    );
  }
);
