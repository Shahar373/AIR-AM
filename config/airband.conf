# ============================================================================
#  AIR-AM  -  קובץ הגדרות התחלתי (ברירת מחדל) ל-rtl_airband
# ----------------------------------------------------------------------------
#  ⚠️ קובץ זה מנוהל אוטומטית ע"י בורר התדרים (airam-web).
#     בכל כיוונון מהממשק הוובי הוא נכתב מחדש. אין צורך לערוך ידנית.
#
#  ברירת מחדל: ATIS נתב"ג 132.500 MHz (משדר ברצף => בדיקה טובה).
#  הסיסמה "airam" היא פנימית וקבועה (תואמת ל-Icecast) - אתה לא נדרש אליה.
# ============================================================================
localtime = true;   # חותמות הזמן בשמות קובצי ההקלטה בזמן מקומי
stats_filepath = "/run/rtl_airband_stats.txt";   # מדדי RF (signal/noise) ל-/api/metrics
# (אין כאן output הקלטות: ברירת המחדל היא ATIS עם סקוולץ' פתוח => אין שידורים בדידים)
devices:
(
  {
    type = "soapysdr";
    # AGC (אין שורת gain) + מצב LNA 4 (rfgain_sel) + מסנן FM כבוי — זהה לפלט של
    # render_config עבור DEFAULT_STATE. בלי rfgain_sel ה-AGC רץ ב-LNA=0 (רווח RF
    # מרבי, רוויה לפני ה-AGC) — ר' _device_string ב-app.py.
    device_string = "driver=sdrplay,rfnotch_ctrl=false,rfgain_sel=4";
    sample_rate = 2.56;
    mode = "multichannel";
    centerfreq = 132.7999;   # מוסט מ-freq ב-0.2999MHz (spike ה-DC; לא 0.3 עגול — ר' DC_OFFSET ב-app.py)
    channels:
    (
      {
        freq = 132.5000;
        modulation = "am";
        squelch_snr_threshold = 0;   # תמיד פתוח (ATIS משדר ברצף => auto-squelch נכשל)
        outputs:
        (
          {
            type = "icecast";
            server = "127.0.0.1";
            port = 8000;
            mountpoint = "live.mp3";
            name = "AIR-AM 132.500";
            username = "source";
            password = "airam";
          }
        );
      }
    );
  }
);
