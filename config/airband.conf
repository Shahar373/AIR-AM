# ============================================================================
#  AIR-AM  -  הגדרות RTLSDR-Airband עבור SDRplay RSP1B
# ----------------------------------------------------------------------------
#  קובץ זה מגדיר אילו תדרי תעופה (AM) לפענח ולשדר ל-Icecast.
#  פורמט libconfig. הערות אפשר עם # או // או /* */.
#
#  עקרון חשוב (חלון התדרים):
#    במצב multichannel כל הערוצים חייבים להיות בטווח:
#        centerfreq ± (sample_rate / 2)
#    לדוגמה: centerfreq=120.5 ו-sample_rate=2.56  =>  119.22 .. 121.78 MHz
#
#    ה-RSP1B מסוגל עד ~10 MHz רוחב-פס, אבל כל הבאנד התעופתי (118-137)
#    הוא ~19 MHz - כלומר אי אפשר לכסות את הכל במכשיר אחד בו-זמנית.
#    בוחרים חלון סביב התדרים של שדה התעופה שלך.
# ============================================================================

devices:
(
  {
    # --- חומרה: SDRplay RSP1B דרך SoapySDR ---
    type = "soapysdr";
    device_string = "driver=sdrplay";   # אם יש כמה מכשירים: הוסף ,serial=XXXX

    # רווח (gain) ב-dB. כוונן בין 20 ל-50 לפי קליטה.
    # להסרת השורה => AGC אוטומטי. אם יש עיוות/רעש - הורד את הערך.
    gain = 30;

    # קצב דגימה ב-Msps. 2.56 הוא ערך בטוח ונתמך.
    # ה-Pi 5 שלך יכול יותר (למשל 6.0 או 8.0) כדי לכסות חלון רחב יותר -
    # אבל קודם בדוק תדרים נתמכים:  SoapySDRUtil --probe="driver=sdrplay"
    sample_rate = 2.56;

    mode = "multichannel";

    # תדר מרכז ב-MHz. כוונן לפי שדה התעופה שלך.
    # ברירת מחדל 120.5 => חלון 119.22 .. 121.78 (כולל 121.5 חירום).
    centerfreq = 120.5;

    channels:
    (
      # ----- ערוץ לדוגמה 1: תדר החירום הבינלאומי (Guard) -----
      # מצוין לבדיקה ראשונית כי הוא תקני בכל העולם.
      {
        freq = 121.5;
        modulation = "am";
        # squelch_threshold = -45;   # dBFS - הסר את ההערה כדי לחתוך רעש
        outputs:
        (
          {
            type = "icecast";
            server = "127.0.0.1";
            port = 8000;
            mountpoint = "guard.mp3";
            name = "Guard 121.5";
            genre = "ATC";
            username = "source";
            password = "CHANGE_ME_SOURCE_PASSWORD";   # חייב להתאים ל-icecast.xml
          }
        );
      },

      # ----- ערוץ לדוגמה 2: החלף בתדר Approach/Tower שלך -----
      {
        freq = 119.5;        # <-- שנה לתדר אמיתי שלך (בתוך החלון!)
        modulation = "am";
        outputs:
        (
          {
            type = "icecast";
            server = "127.0.0.1";
            port = 8000;
            mountpoint = "ch2.mp3";
            name = "Channel 119.5";
            genre = "ATC";
            username = "source";
            password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      },

      # ----- ערוץ לדוגמה 3: החלף בתדר Ground שלך -----
      {
        freq = 121.0;        # <-- שנה לתדר אמיתי שלך (בתוך החלון!)
        modulation = "am";
        outputs:
        (
          {
            type = "icecast";
            server = "127.0.0.1";
            port = 8000;
            mountpoint = "ch3.mp3";
            name = "Channel 121.0";
            genre = "ATC";
            username = "source";
            password = "CHANGE_ME_SOURCE_PASSWORD";
          }
        );
      }

      # להוספת עוד ערוצים: שכפל בלוק { ... } עם פסיק מפריד,
      # שמור על mountpoint ייחודי לכל ערוץ, וודא freq בתוך החלון.
    );
  }
);
